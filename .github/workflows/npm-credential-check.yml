# Is NPM_TOKEN a credential that can actually publish?
#
# ─── Why this exists ──────────────────────────────────────────────────────────────────────────
#
# Three consecutive release cycles were burned discovering three DIFFERENT problems with this one
# secret, roughly twenty minutes each, and every one of them was only visible after the tag build
# had already run:
#
#   1. the token had expired          → npm answered every upload with 404 "or you do not have
#                                       permission" (npm hides auth failures behind 404 on publish)
#   2. the secret resolved to EMPTY   → ENEEDAUTH. The secret's timestamp had updated, so it LOOKED
#                                       set; the timestamp only proves a write happened, not what
#                                       was written
#   3. the token was a LOGIN SESSION  → EOTP. It authenticated fine and had read-write on every
#      token rather than an             package, and npm still demanded a one-time password, which
#      automation token                 no CI runner can answer
#
# Run this before tagging a release. It costs about a minute and it separates all three.
#
# ⚠️ THE LAST STEP IS THE ONLY CONCLUSIVE ONE. Authenticating is not the same as being allowed to
# write: case 3 above passed `npm whoami` and `npm access list` and still could not publish. A
# registry WRITE is what triggers npm's 2FA enforcement, so the check performs one — re-pointing
# crypto's `beta` dist-tag at the version it already carries. That is a genuine write and a no-op.
#
# The token itself is never printed. Only its length, the account name, and the verdicts.
name: npm credential check

on:
  workflow_dispatch:

jobs:
  check:
    name: Can NPM_TOKEN publish?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: 1. The secret is present and non-empty
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Length only. An empty secret is failure mode 2 and is invisible everywhere else —
          # GitHub cannot mask an empty string, so it just renders as nothing in the log.
          echo "token length: ${#NODE_AUTH_TOKEN}"
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "FAIL: NPM_TOKEN is empty. The secret exists but has no value."
            echo "Fix: copy the token to the clipboard and run, in a real terminal:"
            echo "  pbpaste | wc -c    # expect ~40, never 0"
            echo "  pbpaste | gh secret set NPM_TOKEN --repo Mygentic-AI/cello-client"
            exit 1
          fi

      - name: 2. The token authenticates
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if ! who=$(npm whoami 2>&1); then
            echo "FAIL: the token does not authenticate — $who"
            echo "Usually means it expired or was revoked. Generate a new one."
            exit 1
          fi
          echo "authenticated as: $who"

      - name: 3. The token has write access to the scope
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm access list packages @cello-protocol || {
            echo "FAIL: cannot read the scope's package list."
            exit 1
          }

      - name: 4. The token can WRITE without a one-time password
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # An idempotent write: point beta at whatever beta already points at. Nothing moves, and
          # npm enforces 2FA on it exactly as it does on publish — which is the whole point. A
          # read-only check cannot see failure mode 3.
          cur=$(npm view @cello-protocol/crypto@beta version)
          echo "re-pointing crypto beta at its current version ($cur) as a no-op write"
          if ! out=$(npm dist-tag add "@cello-protocol/crypto@$cur" beta 2>&1); then
            echo "$out"
            case "$out" in
              *EOTP*|*one-time\ password*)
                echo
                echo "FAIL: this token requires a one-time password, so CI can never use it."
                echo "It is a login-session token (from 'npm login'), not an automation token."
                echo "Fix: npmjs.com -> Access Tokens -> Generate New Token -> Classic -> Automation."
                ;;
              *) echo "FAIL: the write was refused." ;;
            esac
            exit 1
          fi
          echo "$out"
          echo
          echo "PASS: NPM_TOKEN can publish. Safe to tag a release."
