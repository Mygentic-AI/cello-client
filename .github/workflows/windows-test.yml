name: Windows Verification

on:
  push:
    branches: ['fix/windows-cross-platform-ipc']
  workflow_dispatch:

jobs:
  windows-test:
    name: Windows Kernel Verification
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Run Windows IPC & Sidecar Tests
        run: |
          pnpm exec vitest run core/daemon/src/__tests__/ipc-endpoint.test.ts core/daemon/src/__tests__/ipc-server.test.ts core/daemon/src/__tests__/ipc-client.test.ts core/gateway/src/__tests__/gateway-sidecar.test.ts core/adapter-claude-code/src/__tests__/mcp-001-proxy.test.ts
