name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['main']

jobs:
  build:
    name: Build, Test, and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout cello-client
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm 10.33.2
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Install build tools (required by @journeyapps/sqlcipher on Linux)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential libssl-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (tsc --build)
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      # Tarball check 1: no server files leaked across all five publishable packages.
      - name: Tarball check — no server files leaked
        run: |
          for pkg in core/protocol-types core/crypto core/transport core/client core/adapter-claude-code; do
            echo "--- Checking $pkg ---"
            OUTPUT=$(cd "$pkg" && npm pack --dry-run 2>&1)
            echo "$OUTPUT"
            if echo "$OUTPUT" | grep -iE '^npm notice [0-9]' | grep -iE '/directory/|/relay/|/infra/|/\.env'; then
              echo "FAIL: server files found in $pkg tarball"
              exit 1
            fi
            echo "OK: no server files in $pkg tarball"
          done

      # Tarball check 2: SKILL.md present in connect package (AC-004).
      - name: Tarball check — SKILL.md present in connect package
        run: |
          cd core/adapter-claude-code
          OUTPUT=$(npm pack --dry-run 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q 'SKILL.md'; then
            echo "OK: SKILL.md found in tarball"
          else
            echo "FAIL: SKILL.md not found in tarball"
            exit 1
          fi

      # Publish step — only runs on version tags, requires NPM_TOKEN secret.
      # Checks out trustless-cello to publish @cello-protocol/interfaces via pnpm
      # (so workspace:* specifiers are rewritten to real version numbers).
      # All commands use || true for idempotency (E409 if version already exists).
      - name: Checkout trustless-cello (for interfaces publish)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/checkout@v4
        with:
          repository: Mygentic-AI/CELLO
          path: trustless-cello

      - name: Install trustless-cello interfaces dependencies (for publish)
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: trustless-cello
        run: pnpm install --frozen-lockfile --filter @cello-protocol/interfaces...

      - name: Build @cello-protocol/interfaces (for publish)
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: trustless-cello
        run: |
          pnpm --filter @cello-protocol/interfaces run typecheck
          test -d packages/interfaces/dist && test "$(ls -A packages/interfaces/dist)" || (echo "ERROR: dist/ is empty after build" && exit 1)

      - name: Publish to npm (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # DEFAULT IS BETA. Every publish goes to 'beta' unless the tag contains
          # '-latest' (e.g. v1.0.0-latest). Promotion to 'latest' is a manual gate
          # done AFTER verification: `npm dist-tag add @cello-protocol/connect@X.Y.Z latest`
          TAG="beta"
          if [[ "${{ github.ref_name }}" == *-latest ]]; then
            TAG="latest"
          fi
          echo "Publishing with tag: $TAG"

          # Publish @cello-protocol/interfaces from the trustless-cello workspace root
          # using pnpm so workspace:* specifiers are rewritten to real version numbers.
          (cd "$GITHUB_WORKSPACE/trustless-cello" && pnpm publish --filter @cello-protocol/interfaces --access public --no-git-checks --tag "$TAG") || true

          # Publish cello-client packages in dependency order.
          # || true makes each command idempotent (E409 if version already exists).
          pnpm publish --filter @cello-protocol/crypto --access public --no-git-checks --tag "$TAG" || true
          pnpm publish --filter @cello-protocol/protocol-types --access public --no-git-checks --tag "$TAG" || true
          pnpm publish --filter @cello-protocol/transport --access public --no-git-checks --tag "$TAG" || true
          pnpm publish --filter @cello-protocol/client --access public --no-git-checks --tag "$TAG" || true
          pnpm publish --filter @cello-protocol/connect --access public --no-git-checks --tag "$TAG" || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify all published versions match local
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          FAILED=0
          for pkg in protocol-types crypto transport client; do
            local_ver=$(node -p "require('./core/$pkg/package.json').version")
            npm_ver=$(npm view @cello-protocol/$pkg version 2>/dev/null || echo "missing")
            if [ "$local_ver" != "$npm_ver" ]; then
              echo "FAIL: @cello-protocol/$pkg local=$local_ver npm=$npm_ver — bump the version before tagging"
              FAILED=1
            else
              echo "OK: @cello-protocol/$pkg@$local_ver"
            fi
          done
          local_ver=$(node -p "require('./core/adapter-claude-code/package.json').version")
          npm_ver=$(npm view @cello-protocol/connect version 2>/dev/null || echo "missing")
          if [ "$local_ver" != "$npm_ver" ]; then
            echo "FAIL: @cello-protocol/connect local=$local_ver npm=$npm_ver — bump the version before tagging"
            FAILED=1
          else
            echo "OK: @cello-protocol/connect@$local_ver"
          fi
          exit $FAILED
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
