name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['main']

jobs:
  build:
    name: Build, Test, and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm 10.33.2
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (tsc --build)
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test -- --pool-options.threads.maxThreads=1 --pool-options.threads.minThreads=1

      # Tarball check 1: no server files leaked across all five publishable packages.
      # With "files" allowlists in each package.json, only dist/ and package.json are included,
      # so this check guards against any future misconfiguration that removes the allowlist.
      - name: Tarball check — no server files leaked
        run: |
          for pkg in core/protocol-types core/crypto core/transport core/client core/adapter-claude-code; do
            echo "--- Checking $pkg ---"
            OUTPUT=$(cd "$pkg" && npm pack --dry-run 2>&1)
            echo "$OUTPUT"
            # Check filenames only (not content) by looking for suspicious paths in pack output
            if echo "$OUTPUT" | grep -iE '^npm notice [0-9]' | grep -iE 'directory|relay|infra|\.env'; then
              echo "FAIL: server files found in $pkg tarball"
              exit 1
            fi
            echo "OK: no server files in $pkg tarball"
          done

      # Tarball check 2: SKILL.md present in connect package (soft check during scaffold phase — SKILL.md added in REPOSPLIT-002)
      - name: Tarball check — SKILL.md present in connect package (soft check)
        run: |
          cd core/adapter-claude-code
          OUTPUT=$(npm pack --dry-run 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q 'SKILL.md'; then
            echo "OK: SKILL.md found in tarball"
          else
            echo "WARN: SKILL.md not found in tarball (expected during scaffold phase, will be added in REPOSPLIT-002)"
          fi

      # Publish step — only runs on version tags, requires NPM_TOKEN secret
      - name: Publish to npm (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        run: pnpm publish --filter @cello-protocol/connect --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
