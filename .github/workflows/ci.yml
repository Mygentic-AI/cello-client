name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['main']

jobs:
  build:
    name: Build, Test, and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm 10.33.2
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (tsc --build)
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test -- --pool-options.threads.maxThreads=1 --pool-options.threads.minThreads=1

      # Tarball check 1: no server files leaked (directory, relay, infra, .env files must not be in the tarball)
      - name: Tarball check — no server files leaked
        working-directory: core/adapter-claude-code
        run: |
          OUTPUT=$(npm pack --dry-run 2>&1)
          echo "$OUTPUT"
          # This command must EXIT 1 (i.e., grep must find nothing)
          echo "$OUTPUT" | grep -iE 'directory|relay|infra|\.env' && { echo "FAIL: server files found in tarball"; exit 1; } || echo "OK: no server files in tarball"

      # Tarball check 2: SKILL.md present (soft check during scaffold phase — SKILL.md added in REPOSPLIT-002)
      - name: Tarball check — SKILL.md present (soft check)
        working-directory: core/adapter-claude-code
        run: |
          OUTPUT=$(npm pack --dry-run 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q 'SKILL.md'; then
            echo "OK: SKILL.md found in tarball"
          else
            echo "WARN: SKILL.md not found in tarball (expected during scaffold phase, will be added in REPOSPLIT-002)"
          fi

      # Publish step — only runs on version tags, requires NPM_TOKEN secret
      - name: Publish to npm (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        run: pnpm publish --filter @cello-protocol/connect --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
